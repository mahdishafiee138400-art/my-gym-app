Name: Build MehLex Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare web files and icon
        run: |
          mkdir -p www assets
          test -f index.html
          test -f icon.png
          cp index.html sw.js manifest.webmanifest www/
          cp icon.png www/icon.png
          cp icon.png assets/icon.png

      - name: Initialize Node project
        run: npm init -y

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npm install --save-dev @capacitor/assets

      - name: Configure MehLex
        run: |
          npx cap init "MehLex" "com.mehlex.app" --web-dir www
          npx cap add android

      - name: Generate Android icons
        run: npx capacitor-assets generate --android

      # استخراج فایل کلید از روی Secret گیت‌هاب
      - name: Decode Keystore
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > my-release-key.jks

      # ساخت نسخه Release
      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease

      # امضا کردن نسخه Release با کلید اختصاصی برای کافه بازار
      - name: Sign Release APK
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks my-release-key.jks \
            --ks-pass pass:${{ secrets.KEY_STORE_PASSWORD }} \
            --ks-key-alias ${{ secrets.KEY_ALIAS }} \
            --key-pass pass:${{ secrets.KEY_PASSWORD }} \
            --out MehLex-Release-Signed.apk \
            android/app/build/outputs/apk/release/app-release-unsigned.apk

      # آپلود فایل نهایی امضا شده
      - name: Upload Signed MehLex APK
        uses: actions/upload-artifact@v4
        with:
          name: MehLex-Signed-APK
          path: MehLex-Release-Signed.apk
          if-no-files-found: error
          retention-days: 7
