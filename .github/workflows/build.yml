
name: Build MehLex Android APk

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare web files and icon
        run: |
          set -euo pipefail
          mkdir -p www assets
          test -f index.html
          test -f icon.png
          test -f sw.js
          test -f manifest.webmanifest
          cp index.html sw.js manifest.webmanifest icon.png www/
          cp icon.png assets/icon.png

      - name: Initialize Node project
        run: npm init -y

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npm install --save-dev @capacitor/assets

      - name: Configure MehLex
        run: |
          npx cap init "MehLex" "com.mehlex.app" --web-dir www
          npx cap add android

      - name: Generate Android icons
        run: |
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Decode Keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY"
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$GITHUB_WORKSPACE/my-release-key.jks"
          test -s "$GITHUB_WORKSPACE/my-release-key.jks"

      - name: Configure Gradle signing
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("KEYSTORE_FILE"))
                      storePassword System.getenv("KEY_STORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE

      - name: Build signed Release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/my-release-key.jks
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEY_STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          cd android
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease

          test -s app/build/outputs/apk/release/app-release.apk

      - name: Upload Signed MehLex APK
        uses: actions/upload-artifact@v4
        with:
          name: MehLex-Signed-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
