
name: Build MehLex Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare web files and icon
        run: |
          set -euo pipefail
          mkdir -p www assets
          test -f index.html
          test -f icon.png
          test -f sw.js
          test -f manifest.webmanifest
          cp index.html sw.js manifest.webmanifest icon.png www/
          cp icon.png assets/icon.png

      - name: Initialize Node project
        run: npm init -y

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npm install --save-dev @capacitor/assets

      - name: Configure MehLex
        run: |
          npx cap init "MehLex" "com.mehlex.app" --web-dir www
          npx cap add android

      - name: Generate Android icons
        run: |
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Decode Keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY"
          printf '%s' "$SIGNING_KEY" | base64 --decode > my-release-key.jks
          test -s my-release-key.jks

      - name: Build Release APK
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease
          test -f app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Sign Release APK
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$KEY_STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          test -s my-release-key.jks

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)"

          test -n "$APKSIGNER"
          test -f "$APKSIGNER"

          INPUT_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"

          test -f "$INPUT_APK"

          "$APKSIGNER" sign \
            --ks my-release-key.jks \
            --ks-pass env:KEY_STORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --out MehLex-Release-Signed.apk \
            "$INPUT_APK"

          "$APKSIGNER" verify --verbose MehLex-Release-Signed.apk

      - name: Upload Signed MehLex APK
        uses: actions/upload-artifact@v4
        with:
          name: MehLex-Signed-APK
          path: MehLex-Release-Signed.apk
          if-no-files-found: error
          retention-days: 7
