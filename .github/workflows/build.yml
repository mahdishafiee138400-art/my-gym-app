
name: Build MehLex Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare web files
        run: |
          set -euo pipefail
          test -f index.html
          test -f icon.png
          test -f sw.js
          test -f manifest.webmanifest
          mkdir -p www assets
          cp index.html sw.js manifest.webmanifest icon.png www/
          cp icon.png assets/icon.png

      - name: Initialize Node project
        run: npm init -y

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npm install --save-dev @capacitor/assets

      - name: Configure MehLex
        run: |
          npx cap init "MehLex" "com.mehlex.app" --web-dir www
          npx cap add android

      - name: Generate Android icons
        run: |
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Decode and verify signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$SIGNING_KEY"
          test -n "$KEY_STORE_PASSWORD"

          printf '%s' "$SIGNING_KEY" | base64 --decode \
            > "$GITHUB_WORKSPACE/mehlex-release.p12"

          test -s "$GITHUB_WORKSPACE/mehlex-release.p12"

          keytool -list \
            -keystore "$GITHUB_WORKSPACE/mehlex-release.p12" \
            -storetype PKCS12 \
            -storepass "$KEY_STORE_PASSWORD" \
            -alias mehlex

      - name: Configure Gradle signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          s = p.read_text()

          if "signingConfigs {" in s:
              raise SystemExit("Signing configuration already exists; check build.gradle")

          pattern = r'android\s*\{'
          replacement = """android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("KEYSTORE_FILE"))
                      storeType "PKCS12"
                      storePassword System.getenv("KEY_STORE_PASSWORD")
                      keyAlias "mehlex"
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
          """

          s, count = re.subn(pattern, replacement, s, count=1)
          if count != 1:
              raise SystemExit("Could not find android block")

          pattern = r'(buildTypes\s*\{\s*release\s*\{)'
          replacement = r'\1\n            signingConfig signingConfigs.release'

          s, count = re.subn(pattern, replacement, s, count=1)
          if count != 1:
              raise SystemExit("Could not find release buildType")

          p.write_text(s)
          PY

      - name: Build signed Release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/mehlex-release.p12
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$KEY_STORE_PASSWORD"
          test -n "$KEY_PASSWORD"

          cd android
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease

          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify APK signature
        run: |
          set -euo pipefail
          apksigner verify --verbose --print-certs \
            android/app/build/outputs/apk/release/app-release.apk

      - name: Upload MehLex APK
        uses: actions/upload-artifact@v4
        with:
          name: MehLex-Signed-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
